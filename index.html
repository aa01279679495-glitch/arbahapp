<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تطبيق الإعلانات</title>

<!-- ✅ كود AdSense الأساسي (استبدل ca-pub-XXXXXXXXXXXXXXXX بمعرّفك) -->
<script async
  src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
  crossorigin="anonymous"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  [hidden] { display: none !important; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: "Segoe UI", Tahoma, system-ui, sans-serif;
    background: radial-gradient(circle at 50% 0%, #1e2a5a 0%, #0b1020 55%, #05070f 100%);
    color: #fff;
    user-select: none;
  }

  /* ====== الزر الرئيسي ====== */
  .main-btn {
    position: relative;
    width: 210px;
    height: 210px;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    color: #fff;
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: .5px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: linear-gradient(145deg, #ff6b6b 0%, #ee0979 100%);
    box-shadow:
      0 0 0 10px rgba(238, 9, 121, .08),
      0 20px 45px -10px rgba(238, 9, 121, .65),
      inset 0 -6px 18px rgba(0, 0, 0, .25),
      inset 0 6px 18px rgba(255, 255, 255, .25);
    transition: transform .18s ease, box-shadow .25s ease;
    animation: float 3.5s ease-in-out infinite;
  }

  .main-btn .icon { font-size: 2.6rem; line-height: 1; }

  .main-btn:hover  { transform: scale(1.06); }
  .main-btn:active { transform: scale(.94); }

  /* حلقات النبض حول الزر */
  .main-btn::before,
  .main-btn::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(255, 107, 107, .55);
    animation: pulse 2.6s ease-out infinite;
    pointer-events: none;
  }
  .main-btn::after { animation-delay: 1.3s; }

  @keyframes pulse {
    0%   { transform: scale(1);    opacity: .75; }
    100% { transform: scale(1.75); opacity: 0; }
  }
  @keyframes float {
    0%, 100% { translate: 0 0; }
    50%      { translate: 0 -12px; }
  }

  /* ====== النافذة المنبثقة للإعلان ====== */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: rgba(4, 7, 18, .82);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .3s ease, visibility .3s ease;
  }
  .overlay.show { opacity: 1; visibility: visible; }

  .ad-card {
    width: 100%;
    max-width: 420px;
    background: linear-gradient(180deg, #161d33, #101526);
    border: 1px solid rgba(255, 255, 255, .09);
    border-radius: 22px;
    padding: 16px;
    box-shadow: 0 30px 70px -20px #000;
    transform: translateY(18px) scale(.96);
    transition: transform .35s cubic-bezier(.2, .9, .3, 1.3);
  }
  .overlay.show .ad-card { transform: translateY(0) scale(1); }

  .ad-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .ad-label {
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: 1px;
    color: #9aa6c4;
    background: rgba(255, 255, 255, .07);
    border: 1px solid rgba(255, 255, 255, .08);
    padding: 4px 10px;
    border-radius: 999px;
  }

  .close-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: rgba(255, 255, 255, .09);
    color: #cdd5e8;
    font-size: 1.1rem;
    display: grid;
    place-items: center;
    transition: background .2s, transform .2s;
  }
  .close-btn:hover { background: rgba(255, 80, 80, .35); color: #fff; transform: rotate(90deg); }

  .ad-area {
    min-height: 250px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    overflow: hidden;
    background: rgba(0, 0, 0, .22);
    border: 1px dashed rgba(255, 255, 255, .1);
  }

  /* سبينر التحميل */
  .spinner {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, .15);
    border-top-color: #ee0979;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ====== إعلان تجريبي (يظهر قبل ربط AdSense) ====== */
  .demo-ad { width: 100%; padding: 22px 16px; text-align: center; }
  .demo-badge {
    display: inline-block;
    font-size: .68rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    background: rgba(255, 193, 7, .15);
    color: #ffc107;
    border: 1px solid rgba(255, 193, 7, .3);
    margin-bottom: 14px;
  }
  .demo-icon { font-size: 2.6rem; margin-bottom: 8px; }
  .demo-ad h3 { font-size: 1.05rem; margin-bottom: 8px; }
  .demo-ad p  { font-size: .85rem; line-height: 1.7; color: #9aa6c4; margin-bottom: 16px; }
  .demo-cta {
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    font-size: .9rem;
    color: #fff;
    padding: 10px 26px;
    border-radius: 999px;
    background: linear-gradient(135deg, #4f8cff, #7a5cff);
    box-shadow: 0 10px 24px -8px #4f8cff;
    transition: transform .18s;
  }
  .demo-cta:active { transform: scale(.95); }

  .fallback { padding: 26px 18px; text-align: center; color: #9aa6c4; font-size: .88rem; line-height: 1.8; }
  .fallback span { font-size: 2rem; display: block; margin-bottom: 10px; }

  @media (max-width: 380px) {
    .main-btn { width: 175px; height: 175px; font-size: 1.05rem; }
    .main-btn .icon { font-size: 2.1rem; }
  }
</style>
</head>
<body>

  <!-- الزر الكبير في المنتصف -->
  <button class="main-btn" id="openBtn" type="button" aria-label="عرض الإعلان">
    <span class="icon">📢</span>
    <span>اضغط هنا</span>
  </button>

  <!-- نافذة الإعلان -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="محتوى إعلاني">
    <div class="ad-card">
      <div class="ad-head">
        <span class="ad-label">إعلان</span>
        <button class="close-btn" id="closeBtn" type="button" aria-label="إغلاق">✕</button>
      </div>

      <div class="ad-area" id="adArea">
        <div class="spinner" id="loading"></div>
        <div class="fallback" id="fallback" hidden>
          <span>😕</span>
          لا يوجد إعلان متاح حالياً.<br>حاول مرة أخرى بعد قليل.
        </div>
      </div>
    </div>
  </div>

<script>
  /* =====================================================
     ⚙️ الإعدادات — غيّر هذه القيم بعد قبولك في AdSense
     ===================================================== */
  const PUB_ID   = 'ca-pub-XXXXXXXXXXXXXXXX';  // معرّف الناشر
  const AD_SLOT  = '0000000000';               // رقم الوحدة الإعلانية
  const AD_FORMAT = 'auto';                    // auto | rectangle | horizontal ...

  // إذا لم يتم تغيير المعرّف، يعمل التطبيق بالوضع التجريبي
  const DEMO_MODE = PUB_ID.includes('XXXX') || AD_SLOT === '0000000000';

  /* ================= العناصر ================= */
  const openBtn  = document.getElementById('openBtn');
  const overlay  = document.getElementById('overlay');
  const adArea   = document.getElementById('adArea');
  const loading  = document.getElementById('loading');
  const fallback = document.getElementById('fallback');
  const closeBtn = document.getElementById('closeBtn');

  let fillTimer = null;

  /* ================= فتح / إغلاق النافذة ================= */
  function openAd() {
    overlay.classList.add('show');
    document.body.style.overflow = 'hidden';
    loadAd();
  }

  function closeAd() {
    overlay.classList.remove('show');
    document.body.style.overflow = '';
    clearTimeout(fillTimer);
  }

  openBtn.addEventListener('click', openAd);
  closeBtn.addEventListener('click', closeAd);

  // إغلاق بالضغط على الخلفية أو زر ESC
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeAd(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('show')) closeAd();
  });

  /* ================= تحميل الإعلان ================= */
  function loadAd() {
    clearTimeout(fillTimer);

    // تصفير منطقة الإعلان
    adArea.innerHTML = '';
    fallback.hidden = true;

    // إعادة إضافة السبينر
    adArea.appendChild(loading);
    loading.hidden = false;

    if (DEMO_MODE) {
      // 🧪 وضع تجريبي: يعرض تصميماً شبيهًا بالإعلان
      fillTimer = setTimeout(() => {
        loading.hidden = true;
        adArea.innerHTML = `
          <div class="demo-ad">
            <div class="demo-badge">إعلان تجريبي</div>
            <div class="demo-icon">🎯</div>
            <h3>هذه مساحة إعلان جوجل</h3>
            <p>استبدل <b>PUB_ID</b> و <b>AD_SLOT</b> في الكود بمعرّفاتك الحقيقية من لوحة AdSense لتظهر إعلاناتك الفعلية هنا.</p>
            <button class="demo-cta" type="button">اعرف المزيد</button>
          </div>`;
      }, 650);
      return;
    }

    // 🚀 إنشاء وحدة إعلانية جديدة في كل مرة
    const ins = document.createElement('ins');
    ins.className = 'adsbygoogle';
    ins.style.display = 'block';
    ins.style.width = '100%';
    ins.setAttribute('data-ad-client', PUB_ID);
    ins.setAttribute('data-ad-slot', AD_SLOT);
    ins.setAttribute('data-ad-format', AD_FORMAT);
    ins.setAttribute('data-full-width-responsive', 'true');

    adArea.appendChild(ins);

    try {
      (window.adsbygoogle = window.adsbygoogle || []).push({});
    } catch (err) {
      console.error('خطأ في AdSense:', err);
    }

    // التحقق من نجاح تحميل الإعلان
    fillTimer = setTimeout(() => {
      const status = ins.getAttribute('data-ad-status');
      loading.hidden = true;
      if (status === 'unfilled' || !status) {
        ins.remove();
        fallback.hidden = false;
      }
    }, 2800);
  }
</script>
</body>
</html>
